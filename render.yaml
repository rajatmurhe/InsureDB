services:
  - type: web
    name: insuredb
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insuredb-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false

databases:
  - name: insuredb-db
    region: singapore
    plan: free
    databaseName: insuredb
    user: insuredb
    ipAllowList: []
